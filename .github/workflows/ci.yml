name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  # MLflow >= 3.x puts the file-store backend in maintenance mode; opt in
  # explicitly so the pipeline's default tracking works on CI.
  MLFLOW_ALLOW_FILE_STORE: "true"
  MLFLOW_TRACKING_URI: "file:///tmp/mlruns"
  MPLBACKEND: "Agg"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Lint
        run: ruff check src tests

      - name: Test with coverage
        run: pytest tests/ -v --cov=churnlab --cov-report=term-missing --cov-report=xml

      - name: Train on the real dataset
        run: python -m churnlab.pipeline

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t churnlab:ci .
