[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "churnlab"
version = "0.2.0"
description = "Telecom customer churn prediction on the IBM Telco Customer Churn dataset."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "João Vitor Sampaio" }]
dependencies = [
    "pandas==1.5.3",
    "numpy==1.24.4",
    "scikit-learn==1.3.2",
    "xgboost==3.2.0",
    "mlflow==3.16.0",
    "joblib==1.5.3",
    "fastapi==0.133.1",
    "uvicorn==0.41.0",
    "pydantic==2.13.4",
    "matplotlib==3.8.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==6.2.1",
    "httpx==0.28.1",
    "ruff==0.14.2",
]

[project.scripts]
churnlab = "churnlab.pipeline:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["churnlab"]
branch = false

[tool.coverage.report]
show_missing = true
skip_empty = true
